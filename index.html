<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Personal TrAIner</title>
    <meta name="description" content="Your training plan, your meals, and a coach that knows both." />

    <!-- Installability (audit §9.1). Without these the app could only ever be
         a bookmark: no Home Screen install, no standalone window, no offline
         shell, and on iPhone no protection from Safari clearing the storage
         that IS the account after about a week of not opening it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TrAIner" />
    <!-- Matches the default theme's canvas, so the status bar and the app
         don't meet at a visible seam. -->
    <meta name="theme-color" content="#1A1636" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
